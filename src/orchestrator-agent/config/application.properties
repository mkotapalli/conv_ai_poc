app.name=orchestrator-agent
server.host=0.0.0.0
server.port=8081
aws.region=us-east-1
aws.secretsmanager.enabled=true
aws.secretsmanager.secret_name=bcbs-dev-convai-secrets
aws.secretsmanager.region=us-east-1
bedrock.inference_profile_id=us.amazon.nova-2-lite-v1:0
bedrock.max_tokens=1024
bedrock.guardrail.enabled=false
bedrock.guardrail_id=
bedrock.guardrail_version=DRAFT
bedrock.guardrail_trace=enabled
bedrock.guardrail_stream_processing_mode=sync
bedrock.guardrail_redact_input=true
bedrock.guardrail_redact_output=true
bedrock.guardrail_block_message=Your request was blocked by AWS Guardrails. Please rephrase or contact support.
http.timeout.seconds=20
memory.provider=local
memory.storage_path=data/orchestrator-memory.json
auth.sigv4.enabled=false
auth.sigv4.required_header=false
auth.sigv4.trusted_access_key_id=
auth.sigv4.service=execute-api
development.allow_unsigned_local=true
service.account_agent.invoke_mode=strands_a2a
service.account_agent.tool_name=acct_mgmt_agent
service.account_agent.config_path=../acct-mgmt-agent/config/application.properties
service.account_agent.prompt_path=../acct-mgmt-agent/prompts/system_prompt.txt
