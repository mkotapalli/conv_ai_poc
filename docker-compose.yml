services:
  orchestrator-agent:
    build:
      context: ./src/orchestrator-agent
    container_name: orchestrator-agent
    ports:
      - "8081:8080"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SECRETSMANAGER_ENABLED: ${AWS_SECRETSMANAGER_ENABLED:-true}
      AWS_SECRETSMANAGER_SECRET_NAME: ${AWS_SECRETSMANAGER_SECRET_NAME:-bcbs-dev-convai-secrets}
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on:
      - acct-mgmt-agent

  acct-mgmt-agent:
    build:
      context: ./src/acct-mgmt-agent
    container_name: acct-mgmt-agent
    ports:
      - "8082:8080"
      - "8083:8000"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SECRETSMANAGER_ENABLED: ${AWS_SECRETSMANAGER_ENABLED:-true}
      AWS_SECRETSMANAGER_SECRET_NAME: ${AWS_SECRETSMANAGER_SECRET_NAME:-bcbs-dev-convai-secrets}
      SERVER_PORT: 8080
      MCP_SERVER_PORT: 8000
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
